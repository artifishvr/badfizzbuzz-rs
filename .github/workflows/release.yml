name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build and Upload Release Assets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: badfizzbuzz
            asset_name: badfizzbuzz_linux_x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu 
            artifact_name: badfizzbuzz
            asset_name: badfizzbuzz_linux_aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: badfizzbuzz.exe
            asset_name: badfizzbuzz_windows_x86_64.exe
          - os: windows-11-arm 
            target: aarch64-pc-windows-msvc 
            artifact_name: badfizzbuzz.exe
            asset_name: badfizzbuzz_windows_aarch64.exe
          - os: macos-15
            target: aarch64-apple-darwin
            artifact_name: badfizzbuzz
            asset_name: badfizzbuzz_macos_arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: badfizzbuzz
            asset_name: badfizzbuzz_macos_x86_64  

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build
      run: cargo build --release --target ${{ matrix.target }}

    - name: Rename Release Asset
      shell: bash
      run: |
        mv ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ./target/${{ matrix.target }}/release/${{ matrix.asset_name }}

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: ./target/${{ matrix.target }}/release/${{ matrix.asset_name }}